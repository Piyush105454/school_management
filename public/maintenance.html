<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Maintenance - Dhanpuri Public School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --rose: #f43f5e;
      --emerald: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glow effects */
    .glow-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 50%;
      height: 50%;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    .glow-2 {
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 50%;
      height: 50%;
      background: radial-gradient(circle, rgba(244, 63, 94, 0.1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    .container {
      max-width: 540px;
      width: 100%;
      background-color: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      z-index: 2;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo-container {
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
    }

    .logo-badge {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: white;
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
      animation: float 4s ease-in-out infinite;
    }

    .logo-badge svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--primary);
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.5rem;
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* Live Status indicator */
    .status-box {
      background-color: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--primary);
      box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.7);
      animation: pulse 1.8s infinite;
    }

    .pulse-dot.online {
      background-color: var(--emerald);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse-green 1.8s infinite;
    }

    .status-text {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }

    .footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1rem;
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-8px) rotate(2deg);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 10px rgba(79, 70, 229, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(79, 70, 229, 0);
      }
    }

    @keyframes pulse-green {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="container">
    <div class="logo-container">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/>
        </svg>
      </div>
    </div>

    <h1>Dhanpuri Public School</h1>
    <div class="subtitle">System Maintenance</div>

    <p>We are currently updating our portal to deploy new features and optimizations. The system will be back online in a few moments.</p>

    <div class="status-box">
      <div id="statusDot" class="pulse-dot"></div>
      <span id="statusText" class="status-text">Updating portal (checking connection...)</span>
    </div>

    <div class="footer">
      Thank you for your patience. &copy; Dhanpuri Public School
    </div>
  </div>

  <script>
    // Premium Auto-Reload Script
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    
    async function checkSystemStatus() {
      try {
        // Fetch root or any endpoint to check if server is back up
        // Append random query param to prevent browser caching of the 502 response
        const res = await fetch('/?t=' + Date.now(), { 
          method: 'GET',
          cache: 'no-store'
        });
        
        // Next.js responds with 200, 302, 404, or 500 when it is running.
        // A 502 Bad Gateway is specifically from the Nginx proxy being unable to connect,
        // which returns 502. So if status is anything other than 502/503/504, the app is running!
        if (res.status >= 200 && res.status < 500) {
          statusDot.classList.add('online');
          statusText.innerText = "System is online! Reloading page...";
          statusText.style.color = "var(--emerald)";
          
          setTimeout(() => {
            window.location.reload();
          }, 1500);
        } else {
          statusText.innerText = "Applying update... (reloading when ready)";
        }
      } catch (err) {
        statusText.innerText = "Applying update... (reloading when ready)";
      }
    }

    // Check status every 4 seconds
    setInterval(checkSystemStatus, 4000);
    // Initial check
    checkSystemStatus();
  </script>
</body>
</html>
